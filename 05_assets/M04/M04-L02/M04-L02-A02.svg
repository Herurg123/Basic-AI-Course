  <desc id="desc">Полностью вымышленная заметка с временем встречи, темой, именем, телефоном, email и внутренним кодом.</desc>
  <rect width="1100" height="720" fill="#f3f4f6"/>
  <rect x="140" y="70" width="820" height="580" rx="22" fill="#ffffff" stroke="#c7cbd1" stroke-width="3"/>
  <rect x="140" y="70" width="820" height="72" rx="22" fill="#e8ebef"/>
  <circle cx="190" cy="106" r="9" fill="#9aa0a6"/><circle cx="220" cy="106" r="9" fill="#9aa0a6"/><circle cx="250" cy="106" r="9" fill="#9aa0a6"/>
  <text x="550" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#34383d">Учебная заметка — все данные вымышлены</text>
