  <text x="200" y="350" font-family="Arial, sans-serif" font-size="26" fill="#30343a">Тема: обсудить структуру учебного буклета</text>
  <line x1="200" y1="390" x2="900" y2="390" stroke="#d8dadd" stroke-width="2"/>
  <text x="200" y="442" font-family="Arial, sans-serif" font-size="24" fill="#454a50">Участник: Иван Петров</text>
  <text x="200" y="486" font-family="Arial, sans-serif" font-size="24" fill="#454a50">Email: ivan.petrov@example.test</text>
  <text x="200" y="530" font-family="Arial, sans-serif" font-size="24" fill="#454a50">Телефон: +7 900 000-00-00</text>
  <text x="200" y="574" font-family="Arial, sans-serif" font-size="24" fill="#454a50">Внутренний код проекта: ОРБИТА-27</text>
  <text x="550" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7a7f85">Asset M04-L02-A02 · fictional training data</text>
