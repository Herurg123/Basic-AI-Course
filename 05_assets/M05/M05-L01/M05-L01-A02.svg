<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Две авторские версии изображения для вечера настольных игр</title>
  <desc id="desc">Слева спокойная читаемая композиция с крупными игровыми элементами. Справа перегруженная композиция с множеством мелких элементов и мелким текстом.</desc>
  <rect width="1200" height="650" fill="#f2f3f5"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#25282c">M05-L01-A02 · две подготовленные авторские версии</text>

  <rect x="70" y="90" width="480" height="480" rx="24" fill="#dce8f3" stroke="#9eabb8" stroke-width="3"/>
  <text x="310" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">Версия A</text>
  <rect x="210" y="205" width="200" height="140" rx="20" fill="#fff7e0" stroke="#6f6758" stroke-width="4"/>
  <circle cx="260" cy="250" r="17" fill="#6f6758"/><circle cx="360" cy="300" r="17" fill="#6f6758"/>
  <circle cx="355" cy="245" r="17" fill="#6f6758"/><circle cx="265" cy="305" r="17" fill="#6f6758"/>
  <rect x="175" y="380" width="110" height="78" rx="10" fill="#ffffff" stroke="#59636d" stroke-width="3" transform="rotate(-8 230 419)"/>
  <rect x="335" y="380" width="110" height="78" rx="10" fill="#ffffff" stroke="#59636d" stroke-width="3" transform="rotate(8 390 419)"/>
  <text x="310" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#263238">Вечер настольных игр</text>

  <rect x="650" y="90" width="480" height="480" rx="24" fill="#243347" stroke="#111820" stroke-width="3"/>
  <text x="890" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Версия B</text>
  <g fill="#f5d76e" stroke="#111820" stroke-width="2">
    <circle cx="700" cy="190" r="28"/><circle cx="780" cy="180" r="22"/><circle cx="860" cy="210" r="31"/><circle cx="950" cy="175" r="25"/><circle cx="1050" cy="220" r="33"/>
    <rect x="700" y="280" width="65" height="65"/><rect x="805" y="270" width="75" height="75"/><rect x="930" y="290" width="68" height="68"/><rect x="1030" y="280" width="60" height="60"/>
    <circle cx="735" cy="410" r="30"/><circle cx="835" cy="420" r="24"/><circle cx="930" cy="400" r="35"/><circle cx="1040" cy="420" r="27"/>
  </g>
  <text x="890" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#dce3ea">БЕСПЛАТНЫЙ ГОРОДСКОЙ ВЕЧЕР НАСТОЛЬНЫХ ИГР</text>
  <text x="890" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#b9c4cf">игры · общение · новые знакомства · множество деталей</text>

  <text x="600" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#72777d">Обе версии созданы автором курса. Ни одна не является действием ученика.</text>
</svg>
