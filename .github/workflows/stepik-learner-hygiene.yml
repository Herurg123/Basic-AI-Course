name: Stepik Learner Hygiene

on:
  pull_request:
    paths:
      - '04_course/**'
      - '05_assets/**'
      - 'scripts/stepik_uploader/**'
      - 'tests/stepik_uploader/**'
      - '.github/workflows/stepik-learner-hygiene.yml'
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Фиксированный рабочий Stepik course_id проекта.'
        required: true
        default: '299189'
        type: string
      confirm_write:
        description: 'Явно разрешить guarded learner-facing title/content hygiene writes.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  STEPIK_SYNC_ISSUE: '54'

jobs:
  tests:
    name: Offline hygiene tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Запустить unit tests
        run: python -m unittest discover -s tests/stepik_uploader -v

      - name: Проверить реальный канон без Stepik writes
        run: >-
          python scripts/stepik_uploader/stepik_uploader.py dry-run
          --repo-root .
          --report-dir artifacts/stepik-learner-hygiene-ci

  live:
    name: Owner dispatch learner hygiene
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: stepik-live-course-299189
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    env:
      STEPIC_CLIENT_ID: ${{ secrets.STEPIC_CLIENT_ID }}
      STEPIC_CLIENT_SECRET: ${{ secrets.STEPIC_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      COURSE_ID: ${{ inputs.course_id }}
      CONFIRM_WRITE: ${{ inputs.confirm_write }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Прочитать подтверждённый deployment state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${COURSE_ID:-}" || ! "$COURSE_ID" =~ ^[0-9]+$ || "$COURSE_ID" != "299189" ]]; then
            echo 'learner hygiene разрешён только для фиксированного course_id=299189' >&2
            exit 2
          fi
          mkdir -p artifacts/stepik-learner-hygiene
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > artifacts/stepik-learner-hygiene/sync-issue-body.previous.md
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file artifacts/stepik-learner-hygiene/sync-issue-body.previous.md \
            --output artifacts/stepik-learner-hygiene/sync-state.previous.json \
            --course-id "$COURSE_ID"

      - name: Проверить актуальный HEAD main перед live Stepik
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/stepik_uploader/live_guard.py
          --output artifacts/stepik-learner-hygiene/live-source-guard.json

      - name: Выполнить guarded learner hygiene
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo-root .
            --report-dir artifacts/stepik-learner-hygiene
            --course-id "$COURSE_ID"
            --sync-state artifacts/stepik-learner-hygiene/sync-state.previous.json
          )
          if [[ "${CONFIRM_WRITE:-false}" == "true" ]]; then
            python scripts/stepik_uploader/learner_hygiene_recovery_entrypoint.py "${args[@]}" --confirm-write
          else
            python scripts/stepik_uploader/learner_hygiene_preflight.py "${args[@]}"
          fi

      - name: Race-check и обновить Issue 54 после подтверждённого read-back
        if: ${{ success() && inputs.confirm_write == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-learner-hygiene'
          if [[ ! -f "$base/sync-state.next.json" || ! -f "$base/run-report.json" ]]; then
            echo 'Успешный learner hygiene обязан сформировать sync-state.next.json и run-report.json' >&2
            exit 2
          fi

          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/sync-issue-body.current.md"
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file "$base/sync-issue-body.current.md" \
            --output "$base/sync-state.current.json" \
            --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py compare \
            --expected-state "$base/sync-state.previous.json" \
            --current-state "$base/sync-state.current.json" \
            --course-id "$COURSE_ID"

          if [[ -f "$base/state-update-required.flag" ]]; then
            python scripts/stepik_uploader/sync_issue_state.py replace \
              --body-file "$base/sync-issue-body.current.md" \
              --state-file "$base/sync-state.next.json" \
              --output-body "$base/sync-issue-body.next.md" \
              --output-patch "$base/sync-issue-patch.json" \
              --course-id "$COURSE_ID"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --input "$base/sync-issue-patch.json" >/dev/null
          else
            python scripts/stepik_uploader/sync_issue_state.py compare \
              --expected-state "$base/sync-state.next.json" \
              --current-state "$base/sync-state.current.json" \
              --course-id "$COURSE_ID"
          fi

      - name: Commit durable history только после machine-state boundary
        if: ${{ success() && inputs.confirm_write == true }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-learner-hygiene'
          shopt -s nullglob
          events=("$base"/tracked-events/*.json)
          for event in "${events[@]}"; do
            python scripts/stepik_uploader/history_cli.py mark-state-committed \
              --event-file "$event" \
              --state-file "$base/sync-state.next.json"
          done

      - name: Добавить journal в Issue 54
        if: ${{ success() && inputs.confirm_write == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          journal='artifacts/stepik-learner-hygiene/sync-journal.md'
          if [[ -f "$journal" ]]; then
            gh issue comment "$STEPIK_SYNC_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$journal"
          fi

      - name: Сохранить технический отчёт
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-learner-hygiene-${{ github.run_id }}
          path: artifacts/stepik-learner-hygiene/
          if-no-files-found: warn
          retention-days: 90
