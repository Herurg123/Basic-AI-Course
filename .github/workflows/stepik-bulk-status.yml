name: Stepik Bulk Status

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Числовой Stepik course_id. Режим только читает Stepik и ничего не записывает.'
        required: false
        default: '299189'
        type: string

permissions:
  contents: read
  issues: read

env:
  STEPIK_SYNC_ISSUE: '54'

jobs:
  tests:
    name: Offline tests перед live preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Запустить unit tests
        run: python -m unittest discover -s tests/stepik_uploader -v

  bulk_status:
    name: Read-only status всех 21 уроков
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: stepik-live-course-299189
      cancel-in-progress: false
    env:
      STEPIC_CLIENT_ID: ${{ secrets.STEPIC_CLIENT_ID }}
      STEPIC_CLIENT_SECRET: ${{ secrets.STEPIC_CLIENT_SECRET }}
      COURSE_ID: ${{ inputs.course_id }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Прочитать подтверждённый deployment baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${COURSE_ID:-}" || ! "$COURSE_ID" =~ ^[0-9]+$ ]]; then
            echo 'course_id должен быть обычным положительным числом' >&2
            exit 2
          fi
          mkdir -p artifacts/stepik-bulk-status
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > artifacts/stepik-bulk-status/sync-issue-body.md
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file artifacts/stepik-bulk-status/sync-issue-body.md \
            --output artifacts/stepik-bulk-status/sync-state.previous.json \
            --course-id "$COURSE_ID"

      - name: Проверить актуальный HEAD main перед live Stepik
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/stepik_uploader/live_guard.py
          --output artifacts/stepik-bulk-status/live-source-guard.json

      - name: Проверить весь курс без Stepik writes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stepik_uploader/bulk_status.py \
            --repo-root . \
            --report-dir artifacts/stepik-bulk-status \
            --course-id "$COURSE_ID" \
            --sync-state artifacts/stepik-bulk-status/sync-state.previous.json

      - name: Сохранить полный preflight-отчёт
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-bulk-status-${{ github.run_id }}
          path: artifacts/stepik-bulk-status/
          if-no-files-found: warn
          retention-days: 90
