name: "Stepik: завершить подтверждённую NOOP-запись M06-L04"

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Только приватный курс 299189'
        required: true
        default: '299189'
        type: string
      confirm_recovery:
        description: 'Разрешить точное завершение уже подтверждённой NOOP-записи в GitHub Issue #54 и WAL, БЕЗ PUT в Stepik.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  reconcile:
    name: Довести машинный baseline M06-L04 до подтверждённого состояния
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    concurrency:
      group: stepik-live-course-299189
      cancel-in-progress: false
    env:
      STEPIC_CLIENT_ID: ${{ secrets.STEPIC_CLIENT_ID }}
      STEPIC_CLIENT_SECRET: ${{ secrets.STEPIC_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      COURSE_ID: ${{ inputs.course_id }}
      CONFIRM_RECOVERY: ${{ inputs.confirm_recovery }}
      STEPIK_HISTORY_ANCHOR_CACHE: artifacts/stepik-m06-l04-noop-finalize/history-anchor-cache.json
      STEPIK_HISTORY_BLOB_CACHE_DIR: /tmp/stepik-history-blobs
    steps:
      - name: Получить текущую main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt
      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt
      - name: Проверить разрешение владельца и актуальность main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COURSE_ID" != "299189" || "$CONFIRM_RECOVERY" != "true" ]]; then
            echo 'Восстановление разрешено только с явной галочкой confirm_recovery и course_id=299189.' >&2
            exit 2
          fi
          mkdir -p artifacts/stepik-m06-l04-noop-finalize
          gh api "repos/$GITHUB_REPOSITORY/compare/9e73258db9377e1e709cc9a711bf6e1c66380a07...$GITHUB_SHA" --jq '.files[].filename' > artifacts/stepik-m06-l04-noop-finalize/changed-files.txt
          python - <<'PY'
          from pathlib import Path
          files = set(Path("artifacts/stepik-m06-l04-noop-finalize/changed-files.txt").read_text().splitlines())
          allowed = {
              ".github/workflows/stepik-m06-l04-noop-finalize.yml",
              "scripts/stepik_uploader/staging_refresh_runtime.py",
              "scripts/stepik_uploader/repair_m06_l04_noop_commit.py",
              "tests/stepik_uploader/test_staging_refresh_runtime.py",
              "tests/stepik_uploader/test_m06_l04_noop_commit.py",
              "tests/stepik_uploader/test_workflow_live_safety.py",
          }
          if not files or not files.issubset(allowed):
              raise SystemExit("STOP: изменения learner content или постороннего кода после original WAL; нужна новая сверка")
          PY
          python scripts/stepik_uploader/live_guard.py --output artifacts/stepik-m06-l04-noop-finalize/main-guard.before.json
      - name: Проверить live/WAL и подготовить только машинное состояние
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-m06-l04-noop-finalize'
          gh api "repos/$GITHUB_REPOSITORY/issues/54" --jq .body > "$base/issue-body.previous.md"
          python scripts/stepik_uploader/sync_issue_state.py extract --body-file "$base/issue-body.previous.md" --output "$base/sync-state.previous.json" --course-id "$COURSE_ID"
          python -m scripts.stepik_uploader.repair_m06_l04_noop_commit prepare --sync-state "$base/sync-state.previous.json" --output "$base/sync-state.next.json" --approved
      - name: Сверить повторно и зафиксировать только точный итоговый baseline в Issue №54
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-m06-l04-noop-finalize'
          python scripts/stepik_uploader/live_guard.py --output "$base/main-guard.before-patch.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/54" --jq .body > "$base/issue-body.current.md"
          python scripts/stepik_uploader/sync_issue_state.py extract --body-file "$base/issue-body.current.md" --output "$base/sync-state.current.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py compare --expected-state "$base/sync-state.previous.json" --current-state "$base/sync-state.current.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py replace --body-file "$base/issue-body.current.md" --state-file "$base/sync-state.next.json" --output-body "$base/issue-body.next.md" --output-patch "$base/issue-patch.json" --course-id "$COURSE_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/54" --input "$base/issue-patch.json" >/dev/null
      - name: Подтвердить запись Issue и закрыть ровно один старый WAL event
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-m06-l04-noop-finalize'
          python scripts/stepik_uploader/live_guard.py --output "$base/main-guard.before-finalize.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/54" --jq .body > "$base/issue-body.applied.md"
          python scripts/stepik_uploader/sync_issue_state.py extract --body-file "$base/issue-body.applied.md" --output "$base/sync-state.applied.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py compare --expected-state "$base/sync-state.next.json" --current-state "$base/sync-state.applied.json" --course-id "$COURSE_ID"
          python -m scripts.stepik_uploader.repair_m06_l04_noop_commit finalize --sync-state "$base/sync-state.applied.json" --output "$base/reconcile-final.json" --approved
      - name: Зафиксировать итог в журнале
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 54 --repo "$GITHUB_REPOSITORY" --body '### OWNER RECONCILIATION M06-L04
          
          Восстановлена запись GitHub Issue #54 после NOOP_CONFIRMED M06-L04: exact final baseline скопирован из immutable WAL, подтверждён свежим read-only Stepik. PENDING M06-L04 уже закрыт предыдущим запуском; 3 других урока и страница курса остаются PENDING. Machine baseline обновлён для M06-L04, оставшиеся PENDING не тронуты, терминальный MACHINE_STATE_COMMITTED записан. **Записей в Stepik не было.** Можно отдельно проверять оставшиеся PENDING и запускать защищённую публикацию.'
      - name: Сохранить доказательства
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-m06-l04-noop-finalize-${{ github.run_id }}
          path: artifacts/stepik-m06-l04-noop-finalize/
          if-no-files-found: warn
          retention-days: 90
