name: Stepik Golden Title Migration

on:
  pull_request:
    paths:
      - 'scripts/stepik_uploader/**'
      - 'tests/stepik_uploader/**'
      - '04_course/stepik/automation/**'
      - '.github/workflows/stepik-golden-title-migration.yml'
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Фиксированный private Stepik course_id проекта.'
        required: true
        default: '299189'
        type: string
      confirm_write:
        description: 'Owner approval: разрешить только M00-L01/M00-L02 exact title migration.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tests:
    name: Offline golden-title tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Запустить unit tests
        run: python -m unittest discover -s tests/stepik_uploader -v

      - name: Проверить канон без Stepik writes
        run: >-
          python scripts/stepik_uploader/stepik_uploader.py dry-run
          --repo-root .
          --report-dir artifacts/stepik-golden-title-ci

  live:
    name: Owner dispatch golden titles
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: stepik-live-course-299189
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      STEPIC_CLIENT_ID: ${{ secrets.STEPIC_CLIENT_ID }}
      STEPIC_CLIENT_SECRET: ${{ secrets.STEPIC_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      COURSE_ID: ${{ inputs.course_id }}
      CONFIRM_WRITE: ${{ inputs.confirm_write }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Проверить fixed target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${COURSE_ID:-}" || ! "$COURSE_ID" =~ ^[0-9]+$ || "$COURSE_ID" != "299189" ]]; then
            echo 'golden title migration разрешён только для fixed course_id=299189' >&2
            exit 2
          fi

      - name: Проверить актуальный HEAD main перед live Stepik
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/stepik_uploader/live_guard.py
          --output artifacts/stepik-golden-title-migration/live-source-guard.json

      - name: Выполнить guarded golden title preflight/migration
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo-root .
            --report-dir artifacts/stepik-golden-title-migration
            --course-id "$COURSE_ID"
          )
          if [[ "${CONFIRM_WRITE:-false}" == "true" ]]; then
            python scripts/stepik_uploader/golden_title_migration.py "${args[@]}" --confirm-write
          else
            python scripts/stepik_uploader/golden_title_migration.py "${args[@]}"
          fi

      - name: Сохранить технический отчёт
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-golden-title-migration-${{ github.run_id }}
          path: artifacts/stepik-golden-title-migration/
          if-no-files-found: warn
          retention-days: 90

  run_summary:
    name: Русское резюме запуска
    if: ${{ always() }}
    needs: [tests, live]
    permissions:
      actions: read
      checks: read
      contents: read
    uses: ./.github/workflows/_russian-run-summary.yml
    with:
      purpose: >-
        Проверить golden-title контракт и при явном owner-dispatch безопасно выполнить только разрешённую миграцию заголовков M00-L01/M00-L02.
