name: "Stepik: безопасное восстановление M06-L04"

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Только приватный курс 299189'
        required: true
        default: '299189'
        type: string
      confirm_reconcile:
        description: 'Разрешить запись только доказанного промежуточного baseline в Issue #54 и WAL, БЕЗ записи в Stepik.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  reconcile:
    name: Восстановить WAL M06-L04 (без записи в Stepik)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    concurrency:
      group: stepik-live-course-299189
      cancel-in-progress: false
    env:
      STEPIC_CLIENT_ID: ${{ secrets.STEPIC_CLIENT_ID }}
      STEPIC_CLIENT_SECRET: ${{ secrets.STEPIC_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      COURSE_ID: ${{ inputs.course_id }}
      CONFIRM_RECONCILE: ${{ inputs.confirm_reconcile }}
      STEPIK_HISTORY_ANCHOR_CACHE: artifacts/stepik-m06-l04-reconcile/history-anchor-cache.json
      STEPIK_HISTORY_BLOB_CACHE_DIR: /tmp/stepik-history-blobs
    steps:
      - name: Получить текущую main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt
      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt
      - name: Проверить разрешение владельца и актуальность main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COURSE_ID" != "299189" || "$CONFIRM_RECONCILE" != "true" ]]; then
            echo 'Восстановление разрешено только с явной галочкой confirm_reconcile и course_id=299189.' >&2
            exit 2
          fi
          mkdir -p artifacts/stepik-m06-l04-reconcile
          python scripts/stepik_uploader/live_guard.py --output artifacts/stepik-m06-l04-reconcile/main-guard.before.json
      - name: Проверить live/WAL и подготовить только машинное состояние
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-m06-l04-reconcile'
          gh api "repos/$GITHUB_REPOSITORY/issues/54" --jq .body > "$base/issue-body.previous.md"
          python scripts/stepik_uploader/sync_issue_state.py extract --body-file "$base/issue-body.previous.md" --output "$base/sync-state.previous.json" --course-id "$COURSE_ID"
          python -m scripts.stepik_uploader.reconcile_m06_l04 prepare --repo-root . --sync-state "$base/sync-state.previous.json" --output "$base/sync-state.next.json" --owner-approve
      - name: Сверить повторно и записать промежуточный baseline в Issue №54
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-m06-l04-reconcile'
          python scripts/stepik_uploader/live_guard.py --output "$base/main-guard.before-patch.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/54" --jq .body > "$base/issue-body.current.md"
          python scripts/stepik_uploader/sync_issue_state.py extract --body-file "$base/issue-body.current.md" --output "$base/sync-state.current.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py compare --expected-state "$base/sync-state.previous.json" --current-state "$base/sync-state.current.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py replace --body-file "$base/issue-body.current.md" --state-file "$base/sync-state.next.json" --output-body "$base/issue-body.next.md" --output-patch "$base/issue-patch.json" --course-id "$COURSE_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/54" --input "$base/issue-patch.json" >/dev/null
      - name: Подтвердить запись Issue и закрыть ровно один старый WAL event
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-m06-l04-reconcile'
          python scripts/stepik_uploader/live_guard.py --output "$base/main-guard.before-finalize.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/54" --jq .body > "$base/issue-body.applied.md"
          python scripts/stepik_uploader/sync_issue_state.py extract --body-file "$base/issue-body.applied.md" --output "$base/sync-state.applied.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py compare --expected-state "$base/sync-state.next.json" --current-state "$base/sync-state.applied.json" --course-id "$COURSE_ID"
          python -m scripts.stepik_uploader.reconcile_m06_l04 finalize --repo-root . --sync-state "$base/sync-state.applied.json" --output "$base/reconcile-final.json" --owner-approve
      - name: Зафиксировать итог в журнале
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 54 --repo "$GITHUB_REPOSITORY" --body '### OWNER RECONCILIATION M06-L04
          
          Одноразовое восстановление промежуточного live fingerprint M06-L04, после подтверждения step2 11346941 и сетево-неоднозначного step9 11347013. Machine baseline обновлён, PENDING остался открытым, терминальный RECONCILE_COMMITTED записан. **Записей в Stepik не было.** Можно отдельно проверять оставшиеся PENDING и запускать защищённую публикацию.'
      - name: Сохранить доказательства
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-m06-l04-reconcile-${{ github.run_id }}
          path: artifacts/stepik-m06-l04-reconcile/
          if-no-files-found: warn
          retention-days: 90
