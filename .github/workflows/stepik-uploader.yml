name: Stepik: проверка и состояние курса

on:
  pull_request:
    paths:
      - '04_course/**'
      - '05_assets/**'
      - 'scripts/stepik_uploader/**'
      - 'tests/stepik_uploader/**'
      - '.github/workflows/stepik-uploader.yml'
  push:
    branches:
      - main
    paths:
      - '04_course/**'
      - '05_assets/**'
      - 'scripts/stepik_uploader/**'
      - 'tests/stepik_uploader/**'
      - '.github/workflows/stepik-uploader.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Только чтение: локальная проверка, чтение состояния Stepik или предварительная проверка одной цели.'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - inspect
          - target-preflight
      target_id:
        description: 'Одна PENDING-цель для предварительной проверки: Mxx-Lxx или course-page.'
        required: false
        default: ''
        type: string
      course_id:
        description: 'Stepik course_id для режима чтения состояния.'
        required: false
        default: '299189'
        type: string

permissions:
  contents: read

env:
  STEPIK_SYNC_ISSUE: '54'

jobs:
  tests:
    name: Проверить канон и автоматику Stepik
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt
      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt
      - name: Запустить модульные тесты
        run: python -m unittest discover -s tests/stepik_uploader -v
      - name: Проверить реальный канон без записи в Stepik
        run: >-
          python scripts/stepik_uploader/stepik_uploader.py dry-run
          --repo-root .
          --report-dir artifacts/stepik-uploader-ci


      - name: Сформировать русскую сводку проверки
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) result='УСПЕХ' ;;
            failure) result='ОШИБКА' ;;
            cancelled) result='ОТМЕНЕНО' ;;
            *) result="$JOB_STATUS" ;;
          esac
          {
            echo '## Stepik: проверка канона и автоматики'
            echo
            echo "- **Итог:** $result"
            echo '- **Запись в Stepik:** не выполнялась.'
            echo '- **Что проверялось:** модульные тесты и структурная сборка канонического курса.'
            if [[ "$JOB_STATUS" != "success" ]]; then
              echo
              echo '### Что делать при ошибке'
              echo 'Откройте первый красный шаг выше. Русское сообщение проекта объясняет причину, а техническая трассировка ниже используется только как дополнительная диагностика.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  impact:
    name: Обновить машинное состояние PENDING Stepik после слияния
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    steps:
      - name: Получить репозиторий и историю
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Определить влияние изменений на Stepik с учётом зависимостей
        id: impact
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-impact'
          mkdir -p "$base"
          git diff --name-status -M "$BEFORE_SHA" "$GITHUB_SHA" > "$base/changes.tsv"
          git worktree add --detach "$RUNNER_TEMP/stepik-impact-base" "$BEFORE_SHA"
          occurred_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/stepik_uploader/impact.py             --changes "$base/changes.tsv"             --repo-root .             --base-repo-root "$RUNNER_TEMP/stepik-impact-base"             --json-output "$base/impact.json"             --markdown-output "$base/impact.md"             --source-sha "$GITHUB_SHA"             --occurred-at "$occurred_at"
          python - <<'PY'
          import json, os
          data=json.load(open('artifacts/stepik-impact/impact.json',encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('has_impact='+('true' if data['stepik_content_impact'] else 'false')+'\n')
          PY
      - name: Обновить список PENDING в Issue #54
        if: steps.impact.outputs.has_impact == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-impact'
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/issue-body.previous.md"
          python scripts/stepik_uploader/sync_issue_state.py extract             --body-file "$base/issue-body.previous.md" --output "$base/state.previous.json" --course-id 299189
          python scripts/stepik_uploader/sync_issue_state.py apply-impact             --state-file "$base/state.previous.json" --impact-file "$base/impact.json"             --output "$base/state.next.json" --course-id 299189
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/issue-body.current.md"
          python scripts/stepik_uploader/sync_issue_state.py extract             --body-file "$base/issue-body.current.md" --output "$base/state.current.json" --course-id 299189
          python scripts/stepik_uploader/sync_issue_state.py compare             --expected-state "$base/state.previous.json" --current-state "$base/state.current.json" --course-id 299189
          python scripts/stepik_uploader/sync_issue_state.py replace             --body-file "$base/issue-body.current.md" --state-file "$base/state.next.json"             --output-body "$base/issue-body.next.md" --output-patch "$base/issue-patch.json" --course-id 299189
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE"             --input "$base/issue-patch.json" >/dev/null
          gh issue comment "$STEPIK_SYNC_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$base/impact.md"
      - name: Сформировать русскую сводку изменения PENDING
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          HAS_IMPACT: ${{ steps.impact.outputs.has_impact }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) result='УСПЕХ' ;;
            failure) result='ОШИБКА' ;;
            cancelled) result='ОТМЕНЕНО' ;;
            *) result="$JOB_STATUS" ;;
          esac
          {
            echo '## Stepik: влияние изменений main'
            echo
            echo "- **Итог:** $result"
            echo "- **SHA изменения:** `$GITHUB_SHA`"
            echo '- **Запись в Stepik:** не выполнялась.'
            if [[ "$HAS_IMPACT" == "true" ]]; then
              echo '- **Влияние на содержимое Stepik:** обнаружено; машинно-читаемое состояние PENDING в Issue #54 должно быть обновлено.'
            else
              echo '- **Влияние на содержимое Stepik:** не обнаружено.'
            fi
            if [[ -f artifacts/stepik-impact/impact.json ]]; then
              python - <<'PY'
          import json
          p=json.load(open('artifacts/stepik-impact/impact.json',encoding='utf-8'))
          lessons=p.get('affected_lessons') or []
          print(f"- **Уроков, затронутых изменением:** {len(lessons)}")
          if lessons:
              print("- **Затронутые уроки:** " + ", ".join(f"`{x}`" for x in lessons))
          print(f"- **Страница курса затронута:** {'да' if p.get('course_page_changed') else 'нет'}")
          blockers=p.get('blockers') or []
          if blockers:
              print("- **Блокирующие причины:**")
              for item in blockers:
                  print(f"  - `{item}`")
          PY
            fi
            if [[ "$JOB_STATUS" != "success" ]]; then
              echo
              echo '### Что делать при ошибке'
              echo 'Машинное состояние не следует считать успешно обновлённым. Сначала разберите первый красный шаг и подтвердите состояние Issue #54.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить отчёт о влиянии изменений
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-impact-${{ github.run_id }}
          path: artifacts/stepik-impact/
          if-no-files-found: warn
          retention-days: 90

  inspect:
    name: "Stepik: режим только чтения ${{ inputs.mode }}"
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    concurrency:
      group: stepik-live-course-299189
      cancel-in-progress: false
    env:
      STEPIC_CLIENT_ID: ${{ secrets.STEPIC_CLIENT_ID }}
      STEPIC_CLIENT_SECRET: ${{ secrets.STEPIC_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      COURSE_ID: ${{ inputs.course_id }}
      MODE: ${{ inputs.mode }}
      TARGET_ID: ${{ inputs.target_id }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt
      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt
      - name: Проверить текущую main перед чтением Stepik
        if: inputs.mode != 'dry-run'
        run: >-
          python scripts/stepik_uploader/live_guard.py
          --output artifacts/stepik-uploader-live/live-source-guard.json
      - name: Выполнить автоматику только для чтения
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == "dry-run" ]]; then
            python scripts/stepik_uploader/stepik_uploader.py dry-run               --repo-root . --report-dir artifacts/stepik-uploader-live
            exit 0
          fi

          if [[ "$MODE" == "inspect" ]]; then
            python scripts/stepik_uploader/stepik_uploader.py inspect               --repo-root . --report-dir artifacts/stepik-uploader-live               --course-id "$COURSE_ID"
            exit 0
          fi

          if [[ "$MODE" != "target-preflight" ]]; then
            echo "Неизвестный режим только для чтения: $MODE" >&2
            exit 2
          fi
          if [[ "$COURSE_ID" != "299189" ]]; then
            echo 'Предварительная проверка одной цели (target-preflight) разрешена только для course_id=299189.' >&2
            exit 2
          fi
          if [[ -z "$TARGET_ID" ]]; then
            echo 'Предварительная проверка одной цели (target-preflight) требует параметр target_id.' >&2
            exit 2
          fi

          base='artifacts/stepik-uploader-live/target-preflight'
          mkdir -p "$base"
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/sync-issue-body.md"
          python scripts/stepik_uploader/sync_issue_state.py extract             --body-file "$base/sync-issue-body.md"             --output "$base/sync-state.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/staging_batch_plan.py             --repo-root . --course-id "$COURSE_ID"             --sync-state "$base/sync-state.json"             --output "$base/batch-plan.json"
          python scripts/stepik_uploader/live_guard.py --output "$base/live-source-guard.target.json"

          if [[ "$TARGET_ID" == "course-page" ]]; then
            pending="$(python - "$base/sync-state.json" <<'PY'
          import json,sys
          state=json.load(open(sys.argv[1],encoding='utf-8'))
          print('true' if state.get('pending',{}).get('course_page') is not None else 'false')
          PY
            )"
            if [[ "$pending" != "true" ]]; then
              echo 'Страница курса уже не имеет статуса PENDING.'
              exit 0
            fi
            dir="$base/course-page"
            mkdir -p "$dir"
            python scripts/stepik_uploader/course_page_commit_gap_recovery.py               --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"               --sync-state "$base/sync-state.json"
            applicable="$(python - "$dir/course-page-commit-gap-recovery.json" <<'PY'
          import json,sys
          print('true' if json.load(open(sys.argv[1],encoding='utf-8')).get('applicable') is True else 'false')
          PY
            )"
            if [[ "$applicable" != "true" ]]; then
              python scripts/stepik_uploader/course_page_sync.py                 --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"                 --sync-state "$base/sync-state.json"
            fi
            exit 0
          fi

          mode="$(python - "$base/batch-plan.json" "$TARGET_ID" <<'PY'
          import json,sys
          plan=json.load(open(sys.argv[1],encoding='utf-8'))
          target=sys.argv[2]
          if target in plan.get('refresh_target_ids',[]): print('refresh')
          elif target in plan.get('initial_target_ids',[]): print('initial')
          elif target in plan.get('recovery_target_ids',[]): print('recovery')
          else: raise SystemExit(target+' не является текущей PENDING-целью')
          PY
          )"
          dir="$base/lessons/$TARGET_ID"
          mkdir -p "$dir"
          cp "$base/sync-state.json" "$dir/sync-state.previous.json"

          if [[ "$mode" == "refresh" ]]; then
            python scripts/stepik_uploader/staging_refresh_runtime.py               --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"               --target-id "$TARGET_ID" --sync-state "$dir/sync-state.previous.json"
          else
            python scripts/stepik_uploader/staging_commit_gap_recovery.py               --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"               --target-id "$TARGET_ID" --sync-state "$dir/sync-state.previous.json"
            applicable="$(python - "$dir/commit-gap-recovery.json" <<'PY'
          import json,sys
          print('true' if json.load(open(sys.argv[1],encoding='utf-8')).get('applicable') is True else 'false')
          PY
            )"
            if [[ "$mode" == "recovery" && "$applicable" != "true" ]]; then
              echo "$TARGET_ID: запланированная цель восстановления не прошла проверку восстановления (recovery)" >&2
              exit 2
            fi
            if [[ "$applicable" != "true" ]]; then
              python scripts/stepik_uploader/staging_build_runtime.py                 --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"                 --target-id "$TARGET_ID" --sync-state "$dir/sync-state.previous.json"
            fi
          fi
      - name: Сформировать русскую сводку режима только чтения
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) result='УСПЕХ' ;;
            failure) result='ОШИБКА' ;;
            cancelled) result='ОТМЕНЕНО' ;;
            *) result="$JOB_STATUS" ;;
          esac
          case "$MODE" in
            dry-run) mode_ru='локальная проверка без обращения к записи Stepik (dry-run)' ;;
            inspect) mode_ru='чтение состояния курса Stepik (inspect)' ;;
            target-preflight) mode_ru='предварительная проверка одной цели (target-preflight)' ;;
            *) mode_ru="$MODE" ;;
          esac
          {
            echo '## Stepik: режим только чтения'
            echo
            echo "- **Итог:** $result"
            echo "- **Режим:** $mode_ru"
            echo "- **Курс:** `$COURSE_ID`"
            if [[ -n "$TARGET_ID" ]]; then
              echo "- **Цель:** `$TARGET_ID`"
            fi
            echo '- **Запись в Stepik:** запрещена этим рабочим процессом.'
            python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/stepik-uploader-live')
          found=[]
          if root.exists():
              for path in sorted(root.rglob('*.json')):
                  try:
                      data=json.loads(path.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  if not isinstance(data,dict):
                      continue
                  for item in data.get('blockers') or []:
                      if isinstance(item,str) and item not in found:
                          found.append(item)
          if found:
              print("- **Блокирующие причины:**")
              for item in found[:8]:
                  print(f"  - `{item}`")
          PY
            if [[ "$JOB_STATUS" != "success" ]]; then
              echo
              echo '### Что делать при ошибке'
              echo 'Никакой записи в Stepik не выполнялось. Разберите первый красный шаг; после исправления запускайте новую проверку, а не используйте старый результат как актуальный.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить технические артефакты
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-uploader-${{ inputs.mode }}-${{ github.run_id }}
          path: artifacts/stepik-uploader-live/
          if-no-files-found: warn
          retention-days: 90
