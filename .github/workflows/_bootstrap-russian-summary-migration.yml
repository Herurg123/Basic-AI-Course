name: Bootstrap Russian Actions Summary Migration

on:
  push:
    branches:
      - 'governance/russian-action-summaries-2026-09-17'

permissions:
  contents: read

jobs:
  migrate:
    name: Сформировать пакет миграции Actions Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Применить нормативные и workflow-изменения
        run: python scripts/project_governance/migrate_russian_action_summaries.py

      - name: Проверить сформированный пакет
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/_russian-run-summary.yml
          test -f .github/workflows/project-governance.yml
          test -f 00_governance/project-instructions/project-instructions-v1.5.md
          test ! -f .github/workflows/_bootstrap-russian-summary-migration.yml
          test ! -f scripts/project_governance/migrate_russian_action_summaries.py
          python - <<'PY'
          from pathlib import Path
          problems = []
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              if path.name == '_russian-run-summary.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              if '  run_summary:' not in text:
                  problems.append(f'{path}: нет run_summary')
              if 'uses: ./.github/workflows/_russian-run-summary.yml' not in text:
                  problems.append(f'{path}: нет общего summary workflow')
          if problems:
              raise SystemExit('\n'.join(problems))
          print('PASS: пакет покрывает все действующие workflow')
          PY

      - name: Сохранить готовый пакет изменений
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: russian-action-summary-migration-${{ github.run_id }}
          path: |
            .github/workflows/
            00_governance/project-instructions/project-instructions-v1.5.md
            00_governance/project-instructions/README.md
            AGENTS.md
            README.md
          if-no-files-found: error
          retention-days: 7

      - name: Русская сводка bootstrap-миграции
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '# Итог bootstrap-миграции Actions Summary'
            echo
            echo '## Что должно было быть выполнено'
            echo '- Сформировать v1.5 проектной инструкции.'
            echo '- Добавить единый русскоязычный summary для всех workflow.'
            echo '- Добавить governance-проверку будущих workflow.'
            echo '- Подготовить готовые файлы для переноса в рабочую ветку.'
            echo
            echo '## Результат'
            echo '- Статус текущего job: ${{ job.status }}.'
            echo '- При success готовый пакет сохранён как artifact; при failure main не затронут.'
          } >> "$GITHUB_STEP_SUMMARY"
