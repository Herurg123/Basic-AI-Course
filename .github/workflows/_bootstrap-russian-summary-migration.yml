name: Bootstrap Russian Actions Summary Migration

on:
  push:
    branches:
      - 'governance/russian-action-summaries-2026-09-17'

permissions:
  contents: write

jobs:
  migrate:
    name: Применить миграцию Actions Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Применить нормативные и workflow-изменения
        run: python scripts/project_governance/migrate_russian_action_summaries.py

      - name: Зафиксировать изменения в рабочей ветке
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Governance: require Russian GitHub Actions summaries'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Русская сводка bootstrap-миграции
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '# Итог bootstrap-миграции Actions Summary'
            echo
            echo '## Что должно было быть выполнено'
            echo '- Добавить правило русскоязычной Actions Summary.'
            echo '- Обновить все действующие workflow.'
            echo '- Добавить автоматическую проверку будущих workflow.'
            echo '- Зафиксировать изменения в рабочей ветке.'
            echo
            echo '## Результат'
            echo '- Статус текущего job: ${{ job.status }}.'
            echo '- При success миграция и commit выполнены; при failure изменения main отсутствуют и требуется разбор этого bootstrap-run.'
          } >> "$GITHUB_STEP_SUMMARY"
