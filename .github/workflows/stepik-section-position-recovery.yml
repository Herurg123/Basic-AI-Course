name: Stepik Section Position Recovery

on:
  pull_request:
    paths:
      - '04_course/stepik/automation/**'
      - 'scripts/stepik_uploader/**'
      - 'tests/stepik_uploader/**'
      - '.github/workflows/stepik-section-position-recovery.yml'
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Фиксированный production draft курса.'
        required: true
        default: '299189'
        type: string
      confirm_write:
        description: 'Разрешить guarded восстановление section positions. false = только read-only preflight.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tests:
    name: Offline recovery tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Запустить unit tests
        run: python -m unittest discover -s tests/stepik_uploader -v

      - name: Проверить канонический курс без Stepik writes
        run: >-
          python scripts/stepik_uploader/stepik_uploader.py dry-run
          --repo-root .
          --report-dir artifacts/stepik-section-position-recovery-ci

  live:
    name: Owner dispatch section recovery
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: stepik-live-course-299189
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      STEPIC_CLIENT_ID: ${{ secrets.STEPIC_CLIENT_ID }}
      STEPIC_CLIENT_SECRET: ${{ secrets.STEPIC_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      COURSE_ID: ${{ inputs.course_id }}
      CONFIRM_WRITE: ${{ inputs.confirm_write }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Проверить актуальный HEAD main до любого live Stepik обращения
        run: >-
          python scripts/stepik_uploader/live_guard.py
          --output artifacts/stepik-section-position-recovery/live-source-guard.json

      - name: Выполнить read-only preflight или guarded recovery
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo-root .
            --report-dir artifacts/stepik-section-position-recovery
            --course-id "$COURSE_ID"
          )
          if [[ "${CONFIRM_WRITE:-false}" == "true" ]]; then
            args+=(--confirm-write)
          fi
          python scripts/stepik_uploader/section_position_recovery.py "${args[@]}"

      - name: Сохранить доказательства recovery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-section-position-recovery-${{ github.run_id }}
          path: artifacts/stepik-section-position-recovery/
          if-no-files-found: warn
          retention-days: 90
