name: Stepik Section Position Recovery

on:
  pull_request:
    paths:
      - 'scripts/stepik_uploader/section_write.py'
      - 'scripts/stepik_uploader/section_position_recovery.py'
      - 'scripts/stepik_uploader/title_hygiene.py'
      - 'tests/stepik_uploader/test_section_write.py'
      - 'tests/stepik_uploader/test_section_position_recovery.py'
      - 'tests/stepik_uploader/test_title_hygiene.py'
      - '04_course/stepik/automation/section-position-recovery-2026-09-15.v1.json'
      - '04_course/stepik/automation/SECTION-POSITION-RECOVERY-2026-09-15.md'
      - '.github/workflows/stepik-section-position-recovery.yml'
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Фиксированный рабочий Stepik course_id проекта.'
        required: true
        default: '299189'
        type: string
      confirm_write:
        description: 'Явно разрешить guarded восстановление section.position.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tests:
    name: Offline recovery tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Запустить unit tests
        run: python -m unittest discover -s tests/stepik_uploader -v

      - name: Проверить реальный канон без Stepik writes
        run: >-
          python scripts/stepik_uploader/stepik_uploader.py dry-run
          --repo-root .
          --report-dir artifacts/stepik-section-position-recovery-ci

  live:
    name: Owner dispatch section position recovery
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: stepik-live-course-299189
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    env:
      STEPIC_CLIENT_ID: ${{ secrets.STEPIC_CLIENT_ID }}
      STEPIC_CLIENT_SECRET: ${{ secrets.STEPIC_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      COURSE_ID: ${{ inputs.course_id }}
      CONFIRM_WRITE: ${{ inputs.confirm_write }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Проверить актуальный HEAD main перед live Stepik
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/stepik_uploader/live_guard.py
          --output artifacts/stepik-section-position-recovery/live-source-guard.json

      - name: Выполнить guarded recovery
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo-root .
            --report-dir artifacts/stepik-section-position-recovery
            --course-id "$COURSE_ID"
          )
          if [[ "${CONFIRM_WRITE:-false}" == "true" ]]; then
            args+=(--confirm-write)
          fi
          python scripts/stepik_uploader/section_position_recovery.py "${args[@]}"

      - name: Зафиксировать successful recovery в incident и sync journal
        if: success() && inputs.confirm_write == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          journal='artifacts/stepik-section-position-recovery/sync-journal.md'
          test -f "$journal"
          gh issue comment 74 --repo "$GITHUB_REPOSITORY" --body-file "$journal"
          gh issue comment 54 --repo "$GITHUB_REPOSITORY" --body-file "$journal"

      - name: Сохранить технический отчёт
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-section-position-recovery-${{ github.run_id }}
          path: artifacts/stepik-section-position-recovery/
          if-no-files-found: warn
          retention-days: 90
