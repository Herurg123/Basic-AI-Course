name: Bootstrap Governance Documentation

on:
  push:
    branches:
      - 'governance/russian-action-summaries-2026-09-17'

permissions:
  contents: write

jobs:
  docs:
    name: Зафиксировать нормативные документы v1.5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Сформировать итоговые файлы
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_governance/migrate_russian_action_summaries.py
          sed -i 's/[[:space:]]\+$//' 00_governance/project-instructions/project-instructions-v1.5.md

      - name: Зафиксировать только нормативные документы
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            00_governance/project-instructions/project-instructions-v1.5.md \
            00_governance/project-instructions/README.md \
            AGENTS.md \
            README.md
          git diff --cached --check
          git commit -m 'Governance: document Russian Actions summary contract'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Русская сводка bootstrap
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '# Итог bootstrap нормативных документов'
            echo
            echo '## Что должно было быть выполнено'
            echo '- Создать проектную инструкцию v1.5.'
            echo '- Зафиксировать правило обязательной русскоязычной Actions Summary.'
            echo '- Обновить README и AGENTS.'
            echo
            echo '## Результат'
            echo '- Статус job: ${{ job.status }}.'
            if [[ '${{ job.status }}' == 'success' ]]; then
              echo '- ✅ Нормативные документы сохранены в рабочей ветке.'
              echo '- Невыполненных этапов нет.'
              echo '- Ошибок не зафиксировано.'
            else
              echo '- ❌ Нормативный commit не завершён; main не затронут.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
