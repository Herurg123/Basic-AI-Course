name: "Stepik: приватное обновление курса"

on:
  pull_request:
    paths:
      - 'scripts/stepik_uploader/**'
      - 'tests/stepik_uploader/**'
      - '04_course/stepik/automation/**'
      - '04_course/stepik/course-page.md'
      - '04_course/M*/**'
      - '05_assets/**'
      - '.github/workflows/stepik-private-release.yml'
  workflow_dispatch:
    inputs:
      course_id:
        description: 'ID приватного рабочего staging-курса Stepik (тестовой сборки перед публикацией).'
        required: true
        default: '299189'
        type: string
      confirm_write:
        description: 'false = полная предварительная проверка без записи; true = защищённая синхронизация всех PENDING-уроков и страницы курса.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  STEPIK_SYNC_ISSUE: '54'

jobs:
  tests:
    name: Проверка автоматики приватного обновления Stepik
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt
      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt
      - name: Запустить полный набор офлайн-тестов
        run: python -m unittest discover -s tests/stepik_uploader -v
      - name: Проверить канон без записи в Stepik
        run: >-
          python scripts/stepik_uploader/stepik_uploader.py dry-run
          --repo-root .
          --report-dir artifacts/stepik-private-release-ci


      - name: Сформировать русскую сводку проверки
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) result='УСПЕХ' ;;
            failure) result='ОШИБКА' ;;
            cancelled) result='ОТМЕНЕНО' ;;
            *) result="$JOB_STATUS" ;;
          esac
          {
            echo '## Проверка автоматики приватного обновления Stepik'
            echo
            echo "- **Итог:** $result"
            echo '- **Запись во внешний Stepik:** не выполнялась; это задание CI содержит только тесты и локальную проверку канона.'
            if [[ "$JOB_STATUS" != "success" ]]; then
              echo
              echo '### Что делать при ошибке'
              echo 'Откройте первый красный шаг выше. Собственные сообщения проекта должны быть на русском; техническая трассировка библиотеки может сохраняться как дополнительная диагностика.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Синхронизировать приватный курс Stepik
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
    concurrency:
      group: stepik-live-course-299189
      cancel-in-progress: false
    env:
      STEPIC_CLIENT_ID: ${{ secrets.STEPIC_CLIENT_ID }}
      STEPIC_CLIENT_SECRET: ${{ secrets.STEPIC_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      STEPIK_HISTORY_ANCHOR_CACHE: artifacts/stepik-private-release/history-anchor-cache.json
      STEPIK_HISTORY_BLOB_CACHE_DIR: /tmp/stepik-history-blobs
      COURSE_ID: ${{ inputs.course_id }}
      CONFIRM_WRITE: ${{ inputs.confirm_write }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt
      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Проверить фиксированный охват и текущую main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COURSE_ID" != "299189" ]]; then
            echo 'Приватное обновление разрешено только для course_id=299189.' >&2
            exit 2
          fi
          mkdir -p artifacts/stepik-private-release
          python scripts/stepik_uploader/live_guard.py             --output artifacts/stepik-private-release/live-source-guard.initial.json

      - name: Зафиксировать исходный машинный охват
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/sync-issue-body.initial.md"
          python scripts/stepik_uploader/sync_issue_state.py extract             --body-file "$base/sync-issue-body.initial.md"             --output "$base/sync-state.initial.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/staging_batch_plan.py             --repo-root . --course-id "$COURSE_ID"             --sync-state "$base/sync-state.initial.json"             --output "$base/batch-plan.initial.json"
          python - <<'PY'
          import json
          state = json.load(open('artifacts/stepik-private-release/sync-state.initial.json', encoding='utf-8'))
          pending = state.get('pending', {})
          for target, row in pending.get('lessons', {}).items():
              if row.get('status') != 'PENDING':
                  raise SystemExit(f'{target}: машинное состояние PENDING повреждено')
          if pending.get('course_page') is not None and pending['course_page'].get('status') != 'PENDING':
              raise SystemExit('машинное состояние PENDING страницы курса повреждено')
          PY

      - name: Предварительно проверить все PENDING-уроки без записи
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          mapfile -t targets < <(python - <<'PY'
          import json
          for target in json.load(open('artifacts/stepik-private-release/batch-plan.initial.json',encoding='utf-8'))['target_ids']:
              print(target)
          PY
          )
          for target in "${targets[@]}"; do
            echo "=== ПРЕДВАРИТЕЛЬНАЯ ПРОВЕРКА $target ==="
            dir="$base/preflight/lessons/$target"
            mkdir -p "$dir"
            cp "$base/sync-state.initial.json" "$dir/sync-state.previous.json"
            python scripts/stepik_uploader/live_guard.py --output "$dir/live-source-guard.json"
            mode="$(python - "$target" <<'PY'
          import json,sys
          t=sys.argv[1]
          p=json.load(open('artifacts/stepik-private-release/batch-plan.initial.json',encoding='utf-8'))
          if t in p.get('refresh_target_ids',[]): print('refresh')
          elif t in p.get('initial_target_ids',[]): print('initial')
          elif t in p.get('recovery_target_ids',[]): print('recovery')
          else: raise SystemExit('цель не входит в утверждённый план: '+t)
          PY
            )"
            if [[ "$mode" == "refresh" ]]; then
              python scripts/stepik_uploader/staging_refresh_runtime.py                 --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"                 --target-id "$target" --sync-state "$dir/sync-state.previous.json"
            else
              python scripts/stepik_uploader/staging_commit_gap_recovery.py                 --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"                 --target-id "$target" --sync-state "$dir/sync-state.previous.json"
              applicable="$(python - "$dir/commit-gap-recovery.json" <<'PY'
          import json,sys
          print('true' if json.load(open(sys.argv[1],encoding='utf-8')).get('applicable') is True else 'false')
          PY
              )"
              if [[ "$mode" == "recovery" && "$applicable" != "true" ]]; then
                echo "$target: запланированная цель восстановления не прошла проверку восстановления (recovery)" >&2
                exit 2
              fi
              if [[ "$applicable" != "true" ]]; then
                python scripts/stepik_uploader/staging_build_runtime.py                   --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"                   --target-id "$target" --sync-state "$dir/sync-state.previous.json"
              fi
            fi
            echo "$target:$mode" >> "$base/preflight-passed.txt"
          done

      - name: Предварительно проверить страницу курса без записи
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          dir="$base/preflight/course-page"
          mkdir -p "$dir"
          pending="$(python - <<'PY'
          import json
          state=json.load(open('artifacts/stepik-private-release/sync-state.initial.json', encoding='utf-8'))
          print('true' if state.get('pending',{}).get('course_page') is not None else 'false')
          PY
          )"
          if [[ "$pending" != "true" ]]; then
            echo 'страница курса уже не ожидает синхронизации' > "$dir/already-closed.txt"
            exit 0
          fi
          python scripts/stepik_uploader/course_page_commit_gap_recovery.py             --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"             --sync-state "$base/sync-state.initial.json"
          applicable="$(python - "$dir/course-page-commit-gap-recovery.json" <<'PY'
          import json,sys
          print('true' if json.load(open(sys.argv[1],encoding='utf-8')).get('applicable') is True else 'false')
          PY
          )"
          if [[ "$applicable" != "true" ]]; then
            python scripts/stepik_uploader/course_page_sync.py               --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"               --sync-state "$base/sync-state.initial.json"
          fi

      - name: Проверить неизменность исходника и охвата перед записью
        if: inputs.confirm_write == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          python scripts/stepik_uploader/live_guard.py --output "$base/live-source-guard.before-write.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/sync-issue-body.before-write.md"
          python scripts/stepik_uploader/sync_issue_state.py extract             --body-file "$base/sync-issue-body.before-write.md"             --output "$base/sync-state.before-write.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/staging_batch_plan.py             --repo-root . --course-id "$COURSE_ID"             --sync-state "$base/sync-state.before-write.json"             --output "$base/batch-plan.before-write.json"
          python - <<'PY'
          import json
          a=json.load(open('artifacts/stepik-private-release/batch-plan.initial.json',encoding='utf-8'))
          b=json.load(open('artifacts/stepik-private-release/batch-plan.before-write.json',encoding='utf-8'))
          if a['source_main_sha'] != b['source_main_sha']:
              raise SystemExit('SHA исходника изменился между предварительной проверкой и записью')
          for key in ('initial_target_ids','refresh_target_ids','recovery_target_ids','target_ids'):
              if a.get(key,[]) != b.get(key,[]):
                  raise SystemExit('Состав целей ('+key+') изменился между предварительной проверкой и записью')
          if b.get('blockers'):
              raise SystemExit('Перед записью появились блокирующие причины в пакетном плане')
          PY

      - name: Последовательно синхронизировать все PENDING-уроки
        if: inputs.confirm_write == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          mapfile -t targets < <(python - <<'PY'
          import json
          for target in json.load(open('artifacts/stepik-private-release/batch-plan.initial.json',encoding='utf-8'))['target_ids']:
              print(target)
          PY
          )
          for target in "${targets[@]}"; do
            echo "=== ЗАПИСЬ $target ==="
            dir="$base/write/lessons/$target"
            mkdir -p "$dir"
            gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.previous.md"
            python scripts/stepik_uploader/sync_issue_state.py extract               --body-file "$dir/sync-issue-body.previous.md"               --output "$dir/sync-state.previous.json" --course-id "$COURSE_ID"
            python scripts/stepik_uploader/live_guard.py --output "$dir/live-source-guard.json"
            mode="$(python - "$target" <<'PY'
          import json,sys
          t=sys.argv[1]
          p=json.load(open('artifacts/stepik-private-release/batch-plan.initial.json',encoding='utf-8'))
          if t in p.get('refresh_target_ids',[]): print('refresh')
          elif t in p.get('initial_target_ids',[]): print('initial')
          elif t in p.get('recovery_target_ids',[]): print('recovery')
          else: raise SystemExit('цель не входит в утверждённый план: '+t)
          PY
            )"
            if [[ "$mode" == "refresh" ]]; then
              python scripts/stepik_uploader/staging_refresh_runtime.py                 --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"                 --target-id "$target" --sync-state "$dir/sync-state.previous.json" --confirm-write
            else
              python scripts/stepik_uploader/staging_commit_gap_recovery.py                 --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"                 --target-id "$target" --sync-state "$dir/sync-state.previous.json"
              applicable="$(python - "$dir/commit-gap-recovery.json" <<'PY'
          import json,sys
          print('true' if json.load(open(sys.argv[1],encoding='utf-8')).get('applicable') is True else 'false')
          PY
              )"
              if [[ "$mode" == "recovery" && "$applicable" != "true" ]]; then
                echo "$target: запланированная цель восстановления не прошла восстановление (recovery)" >&2
                exit 2
              fi
              if [[ "$applicable" != "true" ]]; then
                python scripts/stepik_uploader/staging_build_runtime.py                   --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"                   --target-id "$target" --sync-state "$dir/sync-state.previous.json" --confirm-write
              fi
            fi
            state="$dir/sync-state.next.json"
            journal="$dir/sync-journal.md"
            event="$dir/lesson-deployment-event.json"
            for required in "$state" "$journal" "$event"; do
              test -f "$required" || { echo "$target: отсутствует обязательный артефакт выпуска $required" >&2; exit 2; }
            done
            gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.current.md"
            python scripts/stepik_uploader/sync_issue_state.py extract               --body-file "$dir/sync-issue-body.current.md"               --output "$dir/sync-state.current.json" --course-id "$COURSE_ID"
            python scripts/stepik_uploader/sync_issue_state.py compare               --expected-state "$dir/sync-state.previous.json"               --current-state "$dir/sync-state.current.json" --course-id "$COURSE_ID"
            python scripts/stepik_uploader/sync_issue_state.py replace               --body-file "$dir/sync-issue-body.current.md" --state-file "$state"               --output-body "$dir/sync-issue-body.next.md"               --output-patch "$dir/sync-issue-patch.json" --course-id "$COURSE_ID"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE"               --input "$dir/sync-issue-patch.json" >/dev/null
            shopt -s nullglob
            asset_events=("$dir"/asset-deployment-event-*.json)
            for asset_event in "${asset_events[@]}"; do
              python scripts/stepik_uploader/history_cli.py mark-state-committed                 --event-file "$asset_event" --state-file "$state"
            done
            python scripts/stepik_uploader/history_cli.py mark-state-committed               --event-file "$event" --state-file "$state"
            gh issue comment "$STEPIK_SYNC_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$journal"
            echo "$target:$mode" >> "$base/write-committed.txt"
          done

      - name: Синхронизировать course page
        if: inputs.confirm_write == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          dir="$base/write/course-page"
          mkdir -p "$dir"
          python scripts/stepik_uploader/live_guard.py --output "$dir/live-source-guard.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.previous.md"
          python scripts/stepik_uploader/sync_issue_state.py extract             --body-file "$dir/sync-issue-body.previous.md"             --output "$dir/sync-state.previous.json" --course-id "$COURSE_ID"
          pending="$(python - "$dir/sync-state.previous.json" <<'PY'
          import json,sys
          state=json.load(open(sys.argv[1],encoding='utf-8'))
          print('true' if state.get('pending',{}).get('course_page') is not None else 'false')
          PY
          )"
          if [[ "$pending" != "true" ]]; then
            echo 'страница курса уже не ожидает синхронизации' > "$dir/already-closed.txt"
            exit 0
          fi
          python scripts/stepik_uploader/course_page_commit_gap_recovery.py             --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"             --sync-state "$dir/sync-state.previous.json" --confirm-recovery
          applicable="$(python - "$dir/course-page-commit-gap-recovery.json" <<'PY'
          import json,sys
          print('true' if json.load(open(sys.argv[1],encoding='utf-8')).get('applicable') is True else 'false')
          PY
          )"
          if [[ "$applicable" != "true" ]]; then
            python scripts/stepik_uploader/course_page_sync.py               --repo-root . --report-dir "$dir" --course-id "$COURSE_ID"               --sync-state "$dir/sync-state.previous.json" --confirm-write
          fi
          for required in sync-state.next.json course-page-deployment-event.json sync-journal.md; do
            test -f "$dir/$required" || { echo "для страницы курса отсутствует обязательный артефакт $required" >&2; exit 2; }
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.current.md"
          python scripts/stepik_uploader/sync_issue_state.py extract             --body-file "$dir/sync-issue-body.current.md"             --output "$dir/sync-state.current.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py compare             --expected-state "$dir/sync-state.previous.json"             --current-state "$dir/sync-state.current.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py replace             --body-file "$dir/sync-issue-body.current.md" --state-file "$dir/sync-state.next.json"             --output-body "$dir/sync-issue-body.next.md" --output-patch "$dir/sync-issue-patch.json"             --course-id "$COURSE_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE"             --input "$dir/sync-issue-patch.json" >/dev/null
          python scripts/stepik_uploader/special_history_commit.py             --event-file "$dir/course-page-deployment-event.json"
          gh issue comment "$STEPIK_SYNC_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$dir/sync-journal.md"

      - name: Проверить отсутствие PENDING и контрольные baselines всех уроков
        if: inputs.confirm_write == true && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/sync-issue-body.final.md"
          python scripts/stepik_uploader/sync_issue_state.py extract             --body-file "$base/sync-issue-body.final.md"             --output "$base/sync-state.final.json" --course-id "$COURSE_ID"
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.stepik_uploader.canonical import build_structural_manifest

          state=json.load(open('artifacts/stepik-private-release/sync-state.final.json',encoding='utf-8'))
          pending=state.get('pending',{})
          if pending.get('lessons'):
              raise SystemExit('После обновления остались уроки со статусом PENDING: '+', '.join(sorted(pending['lessons'])))
          if pending.get('course_page') is not None:
              raise SystemExit('После обновления страница курса всё ещё имеет статус PENDING')

          manifest=build_structural_manifest(Path('.').resolve(), source_sha='final-gate')
          expected={
              lesson['canonical_id']
              for module in manifest['modules']
              for lesson in module['lessons']
          }
          baselines=set(state.get('lessons',{}))
          missing=sorted(expected-baselines)
          if missing:
              raise SystemExit('Нет финального машинного baseline для: '+', '.join(missing))
          if len(expected) != 21:
              raise SystemExit(f'Количество канонических уроков неожиданно изменилось: {len(expected)}')
          for target in sorted(expected):
              row=state['lessons'][target]
              if not isinstance(row.get('stepik_lesson_id'),int):
                  raise SystemExit(f'{target}: отсутствует Stepik lesson ID')
              if not row.get('step_ids'):
                  raise SystemExit(f'{target}: отсутствуют подтверждённые Stepik step IDs')
          PY

      - name: Сформировать русскую итоговую сводку
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          case "$JOB_STATUS" in
            success) result='УСПЕХ' ;;
            failure) result='ОШИБКА' ;;
            cancelled) result='ОТМЕНЕНО' ;;
            *) result="$JOB_STATUS" ;;
          esac
          {
            echo '## Stepik: приватное обновление курса'
            echo
            echo "- **Итог запуска:** $result"
            if [[ "$CONFIRM_WRITE" == "true" ]]; then
              echo '- **Режим записи в Stepik:** включён (`confirm_write=true`).'
            else
              echo '- **Режим записи в Stepik:** выключен; выполнена только предварительная проверка (`confirm_write=false`).'
            fi
            if [[ -f "$base/batch-plan.initial.json" ]]; then
              python - <<'PY'
          import json
          p=json.load(open('artifacts/stepik-private-release/batch-plan.initial.json',encoding='utf-8'))
          print(f"- **SHA исходника:** `{p['source_main_sha']}`")
          print(f"- **Первичная загрузка новых уроков:** {len(p.get('initial_target_ids',[]))}")
          print(f"- **Обновление существующих уроков:** {len(p.get('refresh_target_ids',[]))}")
          print(f"- **Восстановление незавершённых операций:** {len(p.get('recovery_target_ids',[]))}")
          print(f"- **Страница курса ожидает синхронизации:** {'да' if p.get('course_page_pending') else 'нет'}")
          PY
            fi
            if [[ -f "$base/write-committed.txt" ]]; then
              python - <<'PY'
          from pathlib import Path
          labels={'refresh':'обновление','initial':'первичная загрузка','recovery':'восстановление'}
          rows=[]
          for raw in Path('artifacts/stepik-private-release/write-committed.txt').read_text(encoding='utf-8').splitlines():
              raw=raw.strip()
              if not raw:
                  continue
              target, _, mode = raw.partition(':')
              rows.append(f"`{target}` ({labels.get(mode, mode)})")
          print(f"- **Уроков с зафиксированным завершением операции:** {len(rows)}")
          if rows:
              print("- **Обработанные уроки:** " + ", ".join(rows))
          PY
            else
              echo '- **Уроков с зафиксированным завершением операции:** 0'
            fi
            if [[ -f "$base/sync-state.final.json" ]]; then
              echo '- **Финальное машинное состояние:** подтверждено, ожидающих синхронизации объектов (`PENDING`) нет.'
            elif [[ "$CONFIRM_WRITE" == "true" ]]; then
              echo '- **Финальное машинное состояние:** не подтверждено.'
            else
              echo '- **Финальное машинное состояние:** не изменялось, потому что запись была выключена.'
            fi
            if [[ "$JOB_STATUS" != "success" ]]; then
              echo
              echo '### Причина остановки или ошибки'
              python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/stepik-private-release')
          found=[]
          def add(value):
              if isinstance(value,str) and value.strip() and value.strip() not in found:
                  found.append(value.strip())
              elif isinstance(value,list):
                  for item in value:
                      add(item)
          if root.exists():
              for path in sorted(root.rglob('*.json')):
                  try:
                      data=json.loads(path.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  if not isinstance(data,dict):
                      continue
                  add(data.get('blockers'))
                  if data.get('verdict') in {'BLOCKED','FAILED'}:
                      add(data.get('failure_reason'))
                      add(data.get('reason'))
                      add(data.get('message'))
          if found:
              for item in found[:8]:
                  print(f"- Техническая причина: `{item}`")
          else:
              print("- Автоматически извлечь более точную причину из артефактов не удалось. Откройте первый красный шаг выше: там находится исходная диагностика.")
          PY
              echo
              echo 'Запуск остановлен безопасно. Не используйте автоматический повтор старого запуска, пока не подтверждена причина и актуальность текущего `main`/машинного состояния.'
            else
              echo
              echo '### Следующее действие'
              if [[ "$CONFIRM_WRITE" == "true" ]]; then
                echo 'Если финальное состояние подтверждено и PENDING отсутствует, техническая синхронизация этого запуска завершена.'
              else
                echo 'Предварительная проверка завершена. Для реальной записи нужен отдельный защищённый запуск с `confirm_write=true`.'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-private-release-${{ github.run_id }}
          path: artifacts/stepik-private-release/
          if-no-files-found: warn
          retention-days: 90
