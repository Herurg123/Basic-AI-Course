name: Stepik Private Course Release

on:
  pull_request:
    paths:
      - 'scripts/stepik_uploader/**'
      - 'tests/stepik_uploader/**'
      - '04_course/stepik/automation/**'
      - '04_course/stepik/course-page.md'
      - '04_course/M00/M00-L02/**'
      - '05_assets/**'
      - '.github/workflows/stepik-private-release.yml'
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Только private production-staging course проекта.'
        required: true
        default: '299189'
        type: string
      confirm_write:
        description: 'false = full read-only preflight; true = после полного preflight собрать весь private course, course page и owner-approved M00-L02 7→8.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  STEPIK_SYNC_ISSUE: '54'

jobs:
  tests:
    name: Offline private-release tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Запустить полный offline test suite
        run: python -m unittest discover -s tests/stepik_uploader -v

      - name: Проверить канон без Stepik writes
        run: >-
          python scripts/stepik_uploader/stepik_uploader.py dry-run
          --repo-root .
          --report-dir artifacts/stepik-private-release-ci

  release:
    name: Build complete private Stepik staging
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
    concurrency:
      group: stepik-live-course-299189
      cancel-in-progress: false
    env:
      STEPIC_CLIENT_ID: ${{ secrets.STEPIC_CLIENT_ID }}
      STEPIC_CLIENT_SECRET: ${{ secrets.STEPIC_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      COURSE_ID: ${{ inputs.course_id }}
      CONFIRM_WRITE: ${{ inputs.confirm_write }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Проверить fixed scope и current main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COURSE_ID" != "299189" ]]; then
            echo 'Private release жёстко разрешён только для course_id=299189.' >&2
            exit 2
          fi
          mkdir -p artifacts/stepik-private-release
          python scripts/stepik_uploader/live_guard.py \
            --output artifacts/stepik-private-release/live-source-guard.initial.json

      - name: Зафиксировать initial machine scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/sync-issue-body.initial.md"
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file "$base/sync-issue-body.initial.md" \
            --output "$base/sync-state.initial.json" \
            --course-id "$COURSE_ID"
          python scripts/stepik_uploader/staging_batch_plan.py \
            --repo-root . \
            --course-id "$COURSE_ID" \
            --sync-state "$base/sync-state.initial.json" \
            --output "$base/batch-plan.initial.json"
          python - <<'PY'
          import json
          state = json.load(open('artifacts/stepik-private-release/sync-state.initial.json', encoding='utf-8'))
          pending = state.get('pending', {})
          golden = pending.get('lessons', {}).get('M00-L02')
          if not isinstance(golden, dict) or golden.get('status') != 'PENDING':
              raise SystemExit('Owner-approved release ожидает M00-L02=PENDING на initial run')
          if pending.get('course_page') is None:
              raise SystemExit('Owner-approved release ожидает course_page=PENDING на initial run')
          PY

      - name: Preflight course page без записи
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stepik_uploader/course_page_sync.py \
            --repo-root . \
            --report-dir artifacts/stepik-private-release/preflight/course-page \
            --course-id "$COURSE_ID" \
            --sync-state artifacts/stepik-private-release/sync-state.initial.json

      - name: Preflight owner-approved M00-L02 7→8 без записи
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stepik_uploader/golden_content_migration.py \
            --repo-root . \
            --report-dir artifacts/stepik-private-release/preflight/M00-L02 \
            --course-id "$COURSE_ID" \
            --sync-state artifacts/stepik-private-release/sync-state.initial.json

      - name: Preflight всех ordinary PENDING lessons без записи
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          mapfile -t targets < <(python - <<'PY'
          import json
          plan = json.load(open('artifacts/stepik-private-release/batch-plan.initial.json', encoding='utf-8'))
          for target in plan['target_ids']:
              print(target)
          PY
          )
          for target in "${targets[@]}"; do
            echo "=== PREFLIGHT $target ==="
            dir="$base/preflight/ordinary/$target"
            mkdir -p "$dir"
            cp "$base/sync-state.initial.json" "$dir/sync-state.previous.json"
            python scripts/stepik_uploader/live_guard.py --output "$dir/live-source-guard.json"
            python scripts/stepik_uploader/staging_commit_gap_recovery.py \
              --repo-root . --report-dir "$dir" --course-id "$COURSE_ID" \
              --target-id "$target" --sync-state "$dir/sync-state.previous.json"
            applicable="$(python - "$dir/commit-gap-recovery.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          print('true' if data.get('applicable') is True else 'false')
          PY
            )"
            if [[ "$applicable" != "true" ]]; then
              python scripts/stepik_uploader/staging_build_runtime.py \
                --repo-root . --report-dir "$dir" --course-id "$COURSE_ID" \
                --target-id "$target" --sync-state "$dir/sync-state.previous.json"
            fi
            echo "$target" >> "$base/preflight-passed.txt"
          done

      - name: Проверить неизменность source и ordinary scope перед write
        if: inputs.confirm_write == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          python scripts/stepik_uploader/live_guard.py --output "$base/live-source-guard.before-write.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/sync-issue-body.before-write.md"
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file "$base/sync-issue-body.before-write.md" \
            --output "$base/sync-state.before-write.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/staging_batch_plan.py \
            --repo-root . --course-id "$COURSE_ID" \
            --sync-state "$base/sync-state.before-write.json" \
            --output "$base/batch-plan.before-write.json"
          python - <<'PY'
          import json
          initial = json.load(open('artifacts/stepik-private-release/batch-plan.initial.json', encoding='utf-8'))
          current = json.load(open('artifacts/stepik-private-release/batch-plan.before-write.json', encoding='utf-8'))
          if initial['source_main_sha'] != current['source_main_sha']:
              raise SystemExit('source_main_sha изменился между preflight и write')
          if initial['target_ids'] != current['target_ids']:
              raise SystemExit('ordinary PENDING scope изменился между preflight и write')
          if current.get('blockers'):
              raise SystemExit('Перед write появились batch blockers')
          PY

      - name: Последовательно записать ordinary PENDING lessons
        if: inputs.confirm_write == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          mapfile -t targets < <(python - <<'PY'
          import json
          plan = json.load(open('artifacts/stepik-private-release/batch-plan.initial.json', encoding='utf-8'))
          for target in plan['target_ids']:
              print(target)
          PY
          )
          for target in "${targets[@]}"; do
            echo "=== WRITE $target ==="
            dir="$base/write/ordinary/$target"
            mkdir -p "$dir"
            gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.previous.md"
            python scripts/stepik_uploader/sync_issue_state.py extract \
              --body-file "$dir/sync-issue-body.previous.md" --output "$dir/sync-state.previous.json" --course-id "$COURSE_ID"
            python scripts/stepik_uploader/live_guard.py --output "$dir/live-source-guard.json"
            python scripts/stepik_uploader/staging_commit_gap_recovery.py \
              --repo-root . --report-dir "$dir" --course-id "$COURSE_ID" \
              --target-id "$target" --sync-state "$dir/sync-state.previous.json"
            applicable="$(python - "$dir/commit-gap-recovery.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          print('true' if data.get('applicable') is True else 'false')
          PY
            )"
            if [[ "$applicable" != "true" ]]; then
              python scripts/stepik_uploader/staging_build_runtime.py \
                --repo-root . --report-dir "$dir" --course-id "$COURSE_ID" \
                --target-id "$target" --sync-state "$dir/sync-state.previous.json" --confirm-write
            fi
            state="$dir/sync-state.next.json"
            journal="$dir/sync-journal.md"
            lesson_event="$dir/lesson-deployment-event.json"
            if [[ ! -f "$state" || ! -f "$journal" || ! -f "$lesson_event" ]]; then
              echo "$target: successful write/recovery обязан сформировать next state, journal и lesson event." >&2
              exit 2
            fi
            gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.current.md"
            python scripts/stepik_uploader/sync_issue_state.py extract \
              --body-file "$dir/sync-issue-body.current.md" --output "$dir/sync-state.current.json" --course-id "$COURSE_ID"
            python scripts/stepik_uploader/sync_issue_state.py compare \
              --expected-state "$dir/sync-state.previous.json" --current-state "$dir/sync-state.current.json" --course-id "$COURSE_ID"
            python scripts/stepik_uploader/sync_issue_state.py replace \
              --body-file "$dir/sync-issue-body.current.md" --state-file "$state" \
              --output-body "$dir/sync-issue-body.next.md" --output-patch "$dir/sync-issue-patch.json" --course-id "$COURSE_ID"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --input "$dir/sync-issue-patch.json" >/dev/null
            shopt -s nullglob
            asset_events=("$dir"/asset-deployment-event-*.json)
            for event in "${asset_events[@]}"; do
              python scripts/stepik_uploader/history_cli.py mark-state-committed --event-file "$event" --state-file "$state"
            done
            python scripts/stepik_uploader/history_cli.py mark-state-committed --event-file "$lesson_event" --state-file "$state"
            gh issue comment "$STEPIK_SYNC_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$journal"
            echo "$target" >> "$base/write-committed.txt"
          done

      - name: Синхронизировать course page
        if: inputs.confirm_write == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          dir="$base/write/course-page"
          mkdir -p "$dir"
          python scripts/stepik_uploader/live_guard.py --output "$dir/live-source-guard.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.previous.md"
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file "$dir/sync-issue-body.previous.md" --output "$dir/sync-state.previous.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/course_page_sync.py \
            --repo-root . --report-dir "$dir" --course-id "$COURSE_ID" \
            --sync-state "$dir/sync-state.previous.json" --confirm-write
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.current.md"
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file "$dir/sync-issue-body.current.md" --output "$dir/sync-state.current.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py compare \
            --expected-state "$dir/sync-state.previous.json" --current-state "$dir/sync-state.current.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py replace \
            --body-file "$dir/sync-issue-body.current.md" --state-file "$dir/sync-state.next.json" \
            --output-body "$dir/sync-issue-body.next.md" --output-patch "$dir/sync-issue-patch.json" --course-id "$COURSE_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --input "$dir/sync-issue-patch.json" >/dev/null
          python scripts/stepik_uploader/special_history_commit.py --event-file "$dir/course-page-deployment-event.json"
          gh issue comment "$STEPIK_SYNC_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$dir/sync-journal.md"

      - name: Мигрировать M00-L02 с 7 на 8 шагов последним
        if: inputs.confirm_write == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          dir="$base/write/M00-L02"
          mkdir -p "$dir"
          python scripts/stepik_uploader/live_guard.py --output "$dir/live-source-guard.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.previous.md"
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file "$dir/sync-issue-body.previous.md" --output "$dir/sync-state.previous.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/golden_content_migration.py \
            --repo-root . --report-dir "$dir" --course-id "$COURSE_ID" \
            --sync-state "$dir/sync-state.previous.json" --confirm-write
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.current.md"
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file "$dir/sync-issue-body.current.md" --output "$dir/sync-state.current.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py compare \
            --expected-state "$dir/sync-state.previous.json" --current-state "$dir/sync-state.current.json" --course-id "$COURSE_ID"
          python scripts/stepik_uploader/sync_issue_state.py replace \
            --body-file "$dir/sync-issue-body.current.md" --state-file "$dir/sync-state.next.json" \
            --output-body "$dir/sync-issue-body.next.md" --output-patch "$dir/sync-issue-patch.json" --course-id "$COURSE_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --input "$dir/sync-issue-patch.json" >/dev/null
          python scripts/stepik_uploader/history_cli.py mark-state-committed \
            --event-file "$dir/golden-deployment-event.json" --state-file "$dir/sync-state.next.json"
          gh issue comment "$STEPIK_SYNC_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$dir/sync-journal.md"

      - name: Проверить финальный machine backlog
        if: inputs.confirm_write == true && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/sync-issue-body.final.md"
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file "$base/sync-issue-body.final.md" --output "$base/sync-state.final.json" --course-id "$COURSE_ID"
          python - <<'PY'
          import json
          state = json.load(open('artifacts/stepik-private-release/sync-state.final.json', encoding='utf-8'))
          pending = state.get('pending', {})
          lessons = pending.get('lessons', {})
          if lessons:
              raise SystemExit('После private release остались PENDING lessons: ' + ', '.join(sorted(lessons)))
          if pending.get('course_page') is not None:
              raise SystemExit('После private release course_page всё ещё PENDING')
          baseline = state.get('lessons', {}).get('M00-L02')
          if not isinstance(baseline, dict) or len(baseline.get('step_ids', [])) != 8:
              raise SystemExit('M00-L02 final machine baseline не подтверждает 8 steps')
          PY
          test -f "$base/write/M00-L02/golden-profile.next.json"

      - name: Сводка
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-private-release'
          {
            echo '## Stepik private course release'
            echo
            echo "- confirm_write: $CONFIRM_WRITE"
            if [[ -f "$base/batch-plan.initial.json" ]]; then
              python - <<'PY'
          import json
          p = json.load(open('artifacts/stepik-private-release/batch-plan.initial.json', encoding='utf-8'))
          print(f"- source SHA: `{p['source_main_sha']}`")
          print(f"- ordinary targets: {p['target_count']}")
          print(f"- owner-approved golden pending: {', '.join(p['excluded_golden_pending']) or 'none'}")
          print(f"- course-page pending: {p['course_page_pending']}")
          PY
            fi
            if [[ -f "$base/write-committed.txt" ]]; then
              echo "- ordinary committed: $(paste -sd ', ' "$base/write-committed.txt")"
            fi
            if [[ -f "$base/write/course-page/run-report.json" ]]; then
              echo '- course page: processed with verified read-back'
            fi
            if [[ -f "$base/write/M00-L02/golden-profile.next.json" ]]; then
              echo '- M00-L02: 8-step migration evidence produced; follow-up fixture PR required before ordinary golden validation resumes'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить complete release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-private-release-${{ github.run_id }}
          path: artifacts/stepik-private-release/
          if-no-files-found: warn
          retention-days: 90
