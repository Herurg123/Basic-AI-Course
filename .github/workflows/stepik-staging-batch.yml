name: Stepik Staging Batch Build

on:
  pull_request:
    paths:
      - 'scripts/stepik_uploader/**'
      - 'tests/stepik_uploader/**'
      - '05_assets/**/*.svg'
      - '.github/workflows/stepik-staging-batch.yml'
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Только private production-staging course проекта.'
        required: true
        default: '299189'
        type: string
      confirm_write:
        description: 'false = all-target read-only preflight; true = после успешного preflight всех целей последовательно записать все ordinary PENDING lessons. Golden/course-page исключены.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  STEPIK_SYNC_ISSUE: '54'

jobs:
  tests:
    name: Offline batch-staging tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Запустить полный offline test suite
        run: python -m unittest discover -s tests/stepik_uploader -v

      - name: Проверить реальный канон без Stepik writes
        run: >-
          python scripts/stepik_uploader/stepik_uploader.py dry-run
          --repo-root .
          --report-dir artifacts/stepik-staging-batch-ci

  batch-staging:
    name: Staging build all ordinary PENDING lessons
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
    concurrency:
      group: stepik-live-course-299189
      cancel-in-progress: false
    env:
      STEPIC_CLIENT_ID: ${{ secrets.STEPIC_CLIENT_ID }}
      STEPIC_CLIENT_SECRET: ${{ secrets.STEPIC_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      COURSE_ID: ${{ inputs.course_id }}
      CONFIRM_WRITE: ${{ inputs.confirm_write }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stepik_uploader/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r scripts/stepik_uploader/requirements.txt

      - name: Проверить входы
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COURSE_ID" != "299189" ]]; then
            echo 'Batch staging жёстко разрешён только для course_id=299189.' >&2
            exit 2
          fi

      - name: Зафиксировать initial scope из Issue 54
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-staging-batch'
          mkdir -p "$base"
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/sync-issue-body.initial.md"
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file "$base/sync-issue-body.initial.md" \
            --output "$base/sync-state.initial.json" \
            --course-id "$COURSE_ID"
          python scripts/stepik_uploader/live_guard.py \
            --output "$base/live-source-guard.initial.json"
          python scripts/stepik_uploader/staging_batch_plan.py \
            --repo-root . \
            --course-id "$COURSE_ID" \
            --sync-state "$base/sync-state.initial.json" \
            --output "$base/batch-plan.initial.json"

      - name: Выполнить preflight всех ordinary PENDING lessons
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-staging-batch'
          mapfile -t targets < <(python - <<'PY'
          import json
          plan = json.load(open('artifacts/stepik-staging-batch/batch-plan.initial.json', encoding='utf-8'))
          for target in plan['target_ids']:
              print(target)
          PY
          )

          for target in "${targets[@]}"; do
            echo "=== PREFLIGHT $target ==="
            dir="$base/preflight/$target"
            mkdir -p "$dir"

            gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.previous.md"
            python scripts/stepik_uploader/sync_issue_state.py extract \
              --body-file "$dir/sync-issue-body.previous.md" \
              --output "$dir/sync-state.previous.json" \
              --course-id "$COURSE_ID"
            python scripts/stepik_uploader/live_guard.py \
              --output "$dir/live-source-guard.json"
            python scripts/stepik_uploader/staging_commit_gap_recovery.py \
              --repo-root . \
              --report-dir "$dir" \
              --course-id "$COURSE_ID" \
              --target-id "$target" \
              --sync-state "$dir/sync-state.previous.json"

            applicable="$(python - "$dir/commit-gap-recovery.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          print('true' if data.get('applicable') is True else 'false')
          PY
            )"

            if [[ "$applicable" != "true" ]]; then
              python scripts/stepik_uploader/staging_build_runtime.py \
                --repo-root . \
                --report-dir "$dir" \
                --course-id "$COURSE_ID" \
                --target-id "$target" \
                --sync-state "$dir/sync-state.previous.json"
            fi
            echo "$target" >> "$base/preflight-passed.txt"
          done

      - name: Проверить неизменность batch scope перед записью
        if: inputs.confirm_write == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-staging-batch'
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/sync-issue-body.before-write.md"
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file "$base/sync-issue-body.before-write.md" \
            --output "$base/sync-state.before-write.json" \
            --course-id "$COURSE_ID"
          python scripts/stepik_uploader/live_guard.py \
            --output "$base/live-source-guard.before-write.json"
          python scripts/stepik_uploader/staging_batch_plan.py \
            --repo-root . \
            --course-id "$COURSE_ID" \
            --sync-state "$base/sync-state.before-write.json" \
            --output "$base/batch-plan.before-write.json"
          python - <<'PY'
          import json
          initial = json.load(open('artifacts/stepik-staging-batch/batch-plan.initial.json', encoding='utf-8'))
          current = json.load(open('artifacts/stepik-staging-batch/batch-plan.before-write.json', encoding='utf-8'))
          if initial['source_main_sha'] != current['source_main_sha']:
              raise SystemExit('source_main_sha изменился между batch preflight и write')
          if initial['target_ids'] != current['target_ids']:
              raise SystemExit('PENDING target scope изменился между batch preflight и write')
          if current.get('blockers'):
              raise SystemExit('Перед write появились batch blockers')
          PY

      - name: Последовательно записать все подтверждённые targets
        if: inputs.confirm_write == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-staging-batch'
          mapfile -t targets < <(python - <<'PY'
          import json
          plan = json.load(open('artifacts/stepik-staging-batch/batch-plan.initial.json', encoding='utf-8'))
          for target in plan['target_ids']:
              print(target)
          PY
          )

          for target in "${targets[@]}"; do
            echo "=== WRITE $target ==="
            dir="$base/write/$target"
            mkdir -p "$dir"

            gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.previous.md"
            python scripts/stepik_uploader/sync_issue_state.py extract \
              --body-file "$dir/sync-issue-body.previous.md" \
              --output "$dir/sync-state.previous.json" \
              --course-id "$COURSE_ID"
            python scripts/stepik_uploader/live_guard.py \
              --output "$dir/live-source-guard.json"
            python scripts/stepik_uploader/staging_commit_gap_recovery.py \
              --repo-root . \
              --report-dir "$dir" \
              --course-id "$COURSE_ID" \
              --target-id "$target" \
              --sync-state "$dir/sync-state.previous.json"

            applicable="$(python - "$dir/commit-gap-recovery.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          print('true' if data.get('applicable') is True else 'false')
          PY
            )"

            if [[ "$applicable" != "true" ]]; then
              python scripts/stepik_uploader/staging_build_runtime.py \
                --repo-root . \
                --report-dir "$dir" \
                --course-id "$COURSE_ID" \
                --target-id "$target" \
                --sync-state "$dir/sync-state.previous.json" \
                --confirm-write
            fi

            state="$dir/sync-state.next.json"
            journal="$dir/sync-journal.md"
            lesson_event="$dir/lesson-deployment-event.json"
            if [[ ! -f "$state" || ! -f "$journal" || ! -f "$lesson_event" ]]; then
              echo "$target: successful write/recovery обязан сформировать next state, journal и lesson event." >&2
              exit 2
            fi

            gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$dir/sync-issue-body.current.md"
            python scripts/stepik_uploader/sync_issue_state.py extract \
              --body-file "$dir/sync-issue-body.current.md" \
              --output "$dir/sync-state.current.json" \
              --course-id "$COURSE_ID"
            python scripts/stepik_uploader/sync_issue_state.py compare \
              --expected-state "$dir/sync-state.previous.json" \
              --current-state "$dir/sync-state.current.json" \
              --course-id "$COURSE_ID"
            python scripts/stepik_uploader/sync_issue_state.py replace \
              --body-file "$dir/sync-issue-body.current.md" \
              --state-file "$state" \
              --output-body "$dir/sync-issue-body.next.md" \
              --output-patch "$dir/sync-issue-patch.json" \
              --course-id "$COURSE_ID"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" \
              --input "$dir/sync-issue-patch.json" >/dev/null

            shopt -s nullglob
            asset_events=("$dir"/asset-deployment-event-*.json)
            for event in "${asset_events[@]}"; do
              python scripts/stepik_uploader/history_cli.py mark-state-committed \
                --event-file "$event" \
                --state-file "$state"
            done
            python scripts/stepik_uploader/history_cli.py mark-state-committed \
              --event-file "$lesson_event" \
              --state-file "$state"

            gh issue comment "$STEPIK_SYNC_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$journal"
            echo "$target" >> "$base/write-committed.txt"
          done

      - name: Проверить финальный ordinary backlog
        if: inputs.confirm_write == true && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-staging-batch'
          gh api "repos/$GITHUB_REPOSITORY/issues/$STEPIK_SYNC_ISSUE" --jq .body > "$base/sync-issue-body.final.md"
          python scripts/stepik_uploader/sync_issue_state.py extract \
            --body-file "$base/sync-issue-body.final.md" \
            --output "$base/sync-state.final.json" \
            --course-id "$COURSE_ID"
          python scripts/stepik_uploader/live_guard.py \
            --output "$base/live-source-guard.final.json"
          python scripts/stepik_uploader/staging_batch_plan.py \
            --repo-root . \
            --course-id "$COURSE_ID" \
            --sync-state "$base/sync-state.final.json" \
            --output "$base/batch-plan.final.json"
          python - <<'PY'
          import json
          plan = json.load(open('artifacts/stepik-staging-batch/batch-plan.final.json', encoding='utf-8'))
          if plan.get('blockers'):
              raise SystemExit('Финальный batch plan содержит blockers')
          if plan.get('target_count') != 0:
              raise SystemExit('После batch write остались ordinary PENDING lessons: ' + ', '.join(plan.get('target_ids', [])))
          PY

      - name: Сводка
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          base='artifacts/stepik-staging-batch'
          {
            echo '## Stepik staging batch'
            echo
            if [[ -f "$base/batch-plan.initial.json" ]]; then
              python - <<'PY'
          import json
          p = json.load(open('artifacts/stepik-staging-batch/batch-plan.initial.json', encoding='utf-8'))
          print(f"- source SHA: `{p['source_main_sha']}`")
          print(f"- ordinary targets: {p['target_count']}")
          print(f"- golden pending excluded: {', '.join(p['excluded_golden_pending']) or 'none'}")
          print(f"- course-page pending: {p['course_page_pending']}")
          PY
            fi
            echo "- confirm_write: $CONFIRM_WRITE"
            if [[ -f "$base/write-committed.txt" ]]; then
              echo "- committed targets: $(paste -sd ', ' "$base/write-committed.txt")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить batch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stepik-staging-batch-${{ github.run_id }}
          path: artifacts/stepik-staging-batch/
          if-no-files-found: warn
          retention-days: 90
